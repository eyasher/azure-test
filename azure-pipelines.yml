# Azure Pipelines - Deploy to Azure Static Web App (Plain HTML/CSS/JS)
# Docs: https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: 'New variabale group 20-sep'   # 👈 aapka variable group link ho gaya
- name: app_location
  value: '/'          # source code ka root folder (jahan index.html hai)
- name: api_location
  value: ''            # Azure Functions API folder (agar hai), warna khali
- name: output_location
  value: ''            # plain HTML - koi build output folder nahi, khali rakhein

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

# ---------- DEPLOY STAGE ----------
- task: AzureStaticWebApp@0
  inputs:
    app_location: '$(app_location)'
    api_location: '$(api_location)'
    output_location: '$(output_location)'
    azure_static_web_apps_api_token: $(dev)   # 👈 variable group se aa raha hai
  displayName: 'Deploy to Azure Static Web App'
